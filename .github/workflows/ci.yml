name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore --locked-mode
      - run: dotnet test --no-restore --configuration Release
      - run: dotnet pack src/Entorn.Scanner.Contracts/Entorn.Scanner.Contracts.csproj --no-restore --configuration Release --output artifacts
